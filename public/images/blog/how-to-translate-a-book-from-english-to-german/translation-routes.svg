<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Three routes for translating a book into German</title>
  <desc id="desc">A comparison of professional literary translation, self-managed AI translation, and a managed AI translation service.</desc>
  <rect width="1200" height="675" rx="36" fill="#F7EFE4"/>
  <text x="600" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="46" font-weight="700" fill="#2D1F33">Choose your translation route</text>
  <text x="600" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#665B69">Compare control, workload and support before you begin</text>
  <g font-family="Arial,sans-serif">
    <rect x="60" y="170" width="340" height="430" rx="28" fill="#FFF" stroke="#D9CBE5" stroke-width="3"/>
    <circle cx="230" cy="235" r="42" fill="#F1E7F7"/><path d="M210 236l14 14 28-32" fill="none" stroke="#6C3D77" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="230" y="310" text-anchor="middle" font-size="27" font-weight="700" fill="#2D1F33">Professional translator</text>
    <text x="92" y="365" font-size="21" fill="#534A57">• Close creative collaboration</text><text x="92" y="410" font-size="21" fill="#534A57">• Genre expertise matters</text><text x="92" y="455" font-size="21" fill="#534A57">• Detailed revision process</text>
    <rect x="92" y="510" width="276" height="56" rx="16" fill="#F7EFE4"/><text x="230" y="546" text-anchor="middle" font-size="19" font-weight="700" fill="#6C3D77">Highest budget</text>
    <rect x="430" y="170" width="340" height="430" rx="28" fill="#FFF" stroke="#D9CBE5" stroke-width="3"/>
    <circle cx="600" cy="235" r="42" fill="#F1E7F7"/><path d="M580 245h40M588 228h24M592 262h16" stroke="#6C3D77" stroke-width="8" stroke-linecap="round"/>
    <text x="600" y="310" text-anchor="middle" font-size="27" font-weight="700" fill="#2D1F33">Self-managed AI</text>
    <text x="462" y="365" font-size="21" fill="#534A57">• Fast first draft</text><text x="462" y="410" font-size="21" fill="#534A57">• You manage consistency</text><text x="462" y="455" font-size="21" fill="#534A57">• You arrange all checks</text>
    <rect x="462" y="510" width="276" height="56" rx="16" fill="#F7EFE4"/><text x="600" y="546" text-anchor="middle" font-size="19" font-weight="700" fill="#6C3D77">Highest workload</text>
    <rect x="800" y="170" width="340" height="430" rx="28" fill="#FFF" stroke="#6C3D77" stroke-width="4"/>
    <circle cx="970" cy="235" r="42" fill="#6C3D77"/><path d="M949 236l14 14 30-34" fill="none" stroke="#FFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="970" y="310" text-anchor="middle" font-size="27" font-weight="700" fill="#2D1F33">Managed AI service</text>
    <text x="832" y="365" font-size="21" fill="#534A57">• Translation + review</text><text x="832" y="410" font-size="21" fill="#534A57">• Consistency checks</text><text x="832" y="455" font-size="21" fill="#534A57">• Launch support included</text>
    <rect x="832" y="510" width="276" height="56" rx="16" fill="#6C3D77"/><text x="970" y="546" text-anchor="middle" font-size="19" font-weight="700" fill="#FFF">Balanced support</text>
  </g>
</svg>
