<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">From German translation draft to publication</title>
  <desc id="desc">A five-step workflow covering completeness, language review, metadata localisation, file proofing and launch.</desc>
  <rect width="1200" height="675" rx="36" fill="#F7EFE4"/>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia,serif" font-size="46" font-weight="700" fill="#2D1F33">From German draft to published edition</text>
  <text x="600" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#665B69">The first translation is the beginning of the review process</text>
  <path d="M145 338H1055" stroke="#D9CBE5" stroke-width="12" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(150 0)"><circle cy="338" r="61" fill="#6C3D77"/><text y="349" font-size="34" font-weight="700" fill="#FFF">1</text><text y="450" font-size="24" font-weight="700" fill="#2D1F33">Validate</text><text y="484" font-size="18" fill="#665B69">Missing or repeated</text><text y="510" font-size="18" fill="#665B69">passages</text></g>
    <g transform="translate(375 0)"><circle cy="338" r="61" fill="#6C3D77"/><text y="349" font-size="34" font-weight="700" fill="#FFF">2</text><text y="450" font-size="24" font-weight="700" fill="#2D1F33">Review</text><text y="484" font-size="18" fill="#665B69">Meaning, voice and</text><text y="510" font-size="18" fill="#665B69">natural German</text></g>
    <g transform="translate(600 0)"><circle cy="338" r="61" fill="#6C3D77"/><text y="349" font-size="34" font-weight="700" fill="#FFF">3</text><text y="450" font-size="24" font-weight="700" fill="#2D1F33">Localise</text><text y="484" font-size="18" fill="#665B69">Title, description</text><text y="510" font-size="18" fill="#665B69">and keywords</text></g>
    <g transform="translate(825 0)"><circle cy="338" r="61" fill="#6C3D77"/><text y="349" font-size="34" font-weight="700" fill="#FFF">4</text><text y="450" font-size="24" font-weight="700" fill="#2D1F33">Proof files</text><text y="484" font-size="18" fill="#665B69">Formatting, links</text><text y="510" font-size="18" fill="#665B69">and German characters</text></g>
    <g transform="translate(1050 0)"><circle cy="338" r="61" fill="#E3B45B"/><text y="349" font-size="34" font-weight="700" fill="#2D1F33">5</text><text y="450" font-size="24" font-weight="700" fill="#2D1F33">Launch</text><text y="484" font-size="18" fill="#665B69">Publish, promote</text><text y="510" font-size="18" fill="#665B69">and learn</text></g>
  </g>
</svg>
