<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">German translation brief checklist</title>
  <desc id="desc">Four decisions to document: forms of address, character voice, cultural references, and idioms and invented terms.</desc>
  <rect width="1200" height="675" rx="36" fill="#2D1F33"/>
  <text x="600" y="86" text-anchor="middle" font-family="Georgia,serif" font-size="46" font-weight="700" fill="#FFF">Your German translation brief</text>
  <text x="600" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#D9CBE5">Four decisions that keep the whole book consistent</text>
  <g font-family="Arial,sans-serif">
    <rect x="75" y="175" width="500" height="175" rx="26" fill="#FFF"/><circle cx="135" cy="235" r="30" fill="#E3B45B"/><text x="135" y="245" text-anchor="middle" font-size="27" font-weight="700" fill="#2D1F33">1</text><text x="190" y="225" font-size="28" font-weight="700" fill="#2D1F33">du or Sie?</text><text x="190" y="266" font-size="20" fill="#665B69">Map formality, relationships and</text><text x="190" y="296" font-size="20" fill="#665B69">the moment characters grow closer.</text>
    <rect x="625" y="175" width="500" height="175" rx="26" fill="#FFF"/><circle cx="685" cy="235" r="30" fill="#E3B45B"/><text x="685" y="245" text-anchor="middle" font-size="27" font-weight="700" fill="#2D1F33">2</text><text x="740" y="225" font-size="28" font-weight="700" fill="#2D1F33">Character voice</text><text x="740" y="266" font-size="20" fill="#665B69">Describe humour, rhythm, tone and</text><text x="740" y="296" font-size="20" fill="#665B69">how each speaker should sound.</text>
    <rect x="75" y="390" width="500" height="175" rx="26" fill="#FFF"/><circle cx="135" cy="450" r="30" fill="#E3B45B"/><text x="135" y="460" text-anchor="middle" font-size="27" font-weight="700" fill="#2D1F33">3</text><text x="190" y="440" font-size="28" font-weight="700" fill="#2D1F33">Cultural references</text><text x="190" y="481" font-size="20" fill="#665B69">Decide what stays original, what needs</text><text x="190" y="511" font-size="20" fill="#665B69">context and what should be adapted.</text>
    <rect x="625" y="390" width="500" height="175" rx="26" fill="#FFF"/><circle cx="685" cy="450" r="30" fill="#E3B45B"/><text x="685" y="460" text-anchor="middle" font-size="27" font-weight="700" fill="#2D1F33">4</text><text x="740" y="440" font-size="28" font-weight="700" fill="#2D1F33">Terms and idioms</text><text x="740" y="481" font-size="20" fill="#665B69">Create a glossary for names, invented</text><text x="740" y="511" font-size="20" fill="#665B69">terms and recurring expressions.</text>
  </g>
  <text x="600" y="624" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#E3B45B">Write these choices down before translation starts.</text>
</svg>
